name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the extension makes hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >
        What would you like it to do? If it's a new config option, suggest the
        name, where it lives in `[Reservoir]`, and a sensible default.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you've tried.

  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'm willing to open a pull request for this.
